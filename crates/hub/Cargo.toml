[package]
name = "hub"
description = "Hub: what you know about each client, and where every job starts."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hub"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
hub-model = { path = "../hub-model" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "derive", "json", "chrono"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
toml = "1.2.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
# Calls to Clients (and, from phase 3, the embedding API).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
ulid = "3.0.0"
rand = "0.10.3"
sha2 = "0.11.1"
base64 = "0.23.1"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
ciborium = "0.2.2"
regex = "1"
similar = "2"
rmcp = { version = "3.9.0", features = ["server", "transport-streamable-http-server", "macros"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
