# /etc/nginx/sites-available/hub.kritano.com
# Starts as plain HTTP; `certbot --nginx -d hub.kritano.com --redirect`
# (run by install.sh once DNS points here) adds TLS and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name hub.kritano.com;

    access_log /var/log/nginx/hub.access.log;
    error_log  /var/log/nginx/hub.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    # MCP streams its responses: no buffering, long timeouts.
    location /mcp {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8160;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
