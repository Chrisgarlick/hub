[workspace]
resolver = "3"
members = ["crates/hub", "crates/hub-model"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Keep debug builds small: line tables for our crates, no debug info for
# dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
